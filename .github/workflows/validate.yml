name: Validate manifests

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest JSON
        shell: pwsh
        run: ./scripts/Test-Bucket.ps1
      - name: Test manifest validation
        shell: pwsh
        run: ./scripts/Test-Bucket.test.ps1
